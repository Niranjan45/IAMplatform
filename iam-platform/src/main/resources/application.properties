# ============================================================

# IAM Platform - application.properties

# ============================================================
 
spring.application.name=iam-platform
 
# ------------------------------------------------------------

# Server

# ------------------------------------------------------------

server.port=8081

server.error.include-message=always

server.error.include-binding-errors=always

server.compression.enabled=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
 
# ------------------------------------------------------------

# Datasource (MySQL)

# ------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/IAMplatform

spring.datasource.username=root

spring.datasource.password=Niranjan@45

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
spring.datasource.hikari.maximum-pool-size=20

spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.pool-name=IamHikariPool
 
# ------------------------------------------------------------

# JPA / Hibernate

# ------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.batch_size=50
 app.mail.frontend-base-url=http://localhost:3000
# ------------------------------------------------------------

# Flyway (MySQL)

# ------------------------------------------------------------

spring.flyway.enabled=true

spring.flyway.baseline-on-migrate=true

spring.flyway.locations=classpath:db/migration

spring.flyway.url=${spring.datasource.url}

spring.flyway.user=${spring.datasource.username}

spring.flyway.password=${spring.datasource.password}
 
# ------------------------------------------------------------

# Redis (session/token blacklist/cache/rate-limit store)

# ------------------------------------------------------------

spring.data.redis.host=localhost

spring.data.redis.port=6379

spring.data.redis.password=

spring.data.redis.timeout=3000ms
 
spring.cache.type=redis

spring.cache.redis.time-to-live=600000
 
