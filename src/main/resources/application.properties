server.port=8080
server.error.include-message=always

spring.application.name=iam-platform

# ---------- Datasource (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/IAMplatform_Db
spring.datasource.username=root
spring.datasource.password=Niranjan@45
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# ---------- Mail ----------
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- App / JWT ----------
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItaWFtLXBsYXRmb3JtLWNoYW5nZS1pbi1wcm9kLTIwMjY=}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP:604800000}
app.jwt.issuer=enterprise-iam-platform

# ---------- App / Security ----------
app.security.max-failed-login-attempts=5
app.security.account-lockout-duration-minutes=30
app.security.password-reset-token-expiration-minutes=30
app.security.email-verification-token-expiration-hours=24
app.security.mfa-otp-validity-seconds=30

# ---------- App / CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------- App / Mail ----------
app.mail.from=${MAIL_FROM:no-reply@enterprise-iam.com}
app.mail.frontend-base-url=${FRONTEND_URL:http://localhost:3000}

# ---------- Springdoc ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.enterprise.iam=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
