# ------------------------------------------------------------

# JWT (custom access/refresh tokens issued by this platform)

# ------------------------------------------------------------

app.jwt.secret=c2VjdXJlLXNpZ25pbmcta2V5LWZvci1pYW0tcGxhdGZvcm0tY2hhbmdlLWluLXByb2QtMzI=

app.jwt.access-token-expiration-ms=3600000

app.jwt.refresh-token-expiration-ms=604800000

app.jwt.issuer=iam-platform
 
# ------------------------------------------------------------

# OAuth2 Resource Server

# ------------------------------------------------------------

# Commented out to prevent configuration parsing errors if empty.

# spring.security.oauth2.resourceserver.jwt.issuer-uri=

# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
 
# ------------------------------------------------------------

# MFA / TOTP (backs the zxing QR-code dependency)

# ------------------------------------------------------------

app.mfa.totp.issuer=${MFA_ISSUER:IAM Platform}

app.mfa.totp.window-size=3
 
# ------------------------------------------------------------

# OpenAPI / Swagger

# ------------------------------------------------------------

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method
 
# ------------------------------------------------------------

# Actuator

# ------------------------------------------------------------

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=when-authorized
 
# ------------------------------------------------------------

# Logging

# ------------------------------------------------------------

logging.level.root=INFO

logging.level.com.enterprise.iam=DEBUG

logging.level.org.hibernate.SQL=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# ------------------------------------------------------------
# Security Policies / Brute Force Protection
# ------------------------------------------------------------
app.security.max-failed-login-attempts=5
app.security.lockout-duration-ms=900000

app.security.account-lockout-duration-minutes=30
app.security.password-reset-token-expiration-minutes=60
 app.security.email-verification-token-expiration-hours=30